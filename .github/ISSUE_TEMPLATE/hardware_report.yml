name: 硬體相容性回報（Hardware report）
description: 回報特定平台上的偵測缺失、讀值異常或驅動不支援。這是「支援矩陣」的資料來源。
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        這份範本收集「哪一類硬體上哪一項讀不到／讀錯」的回報，用來校準支援矩陣與降級文案。
        讀不到就說讀不到（如實申報），最怕的是「看起來有數字但其實是猜的」——如果你懷疑某個值是假的，請在這裡說。

  - type: input
    id: version
    attributes:
      label: XinSpect 版本
      description: 主介面「關於」頁的版號。
      placeholder: "3.25"
    validations:
      required: true

  - type: textarea
    id: platform
    attributes:
      label: 平台資訊
      description: |
        處理器型號與世代、主機板型號與 BIOS 版本、晶片組、記憶體（有無 XMP／EXPO）、
        顯示卡、儲存（NVMe 型號）、電源供應器。硬體偵測問題請盡量給全。
      placeholder: "Ryzen 9 7950X / X670E主板 BIOS 1.2.0.5 / DDR5-6000 EXPO 開 / RTX 4080 / SN850X / 1000W"
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: 症狀類型
      options:
        - 某項讀值缺漏（顯示「—」或「查不到」）
        - 讀值明顯錯誤（與已知事實矛盾）
        - 讀值疑似假數字（像被猜出來的）
        - 驅動／ring0 載入失敗
        - 深度測試（DeepBench）無法跑或崩潰
        - 感測器（風扇／溫度／電壓）異常
        - 其他
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 細節描述
      description: 哪一頁、哪一個欄位、期望看到什麼、實際看到什麼。若有錯誤訊息請原文照貼。
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: 匯出報告內容
      description: 主介面「匯出報告」產生的檔案內容（去私密部分後貼上或附檔）。
    validations:
      required: false
