name: 缺陷回報（Bug report）
description: 回報 XinSpect 的錯誤行為、崩潰或與文件不符的宣稱。收集愈完整，重現愈快。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感謝回報。請先確認：同問題在既有 issue 裡沒有人報過；你跑的是官網下載的正式包。
        **本專案對「宣稱與實際不符」零容忍**——如果你發現 UI／文件說了做不到的事，那就是 bug，請直接報。

  - type: input
    id: version
    attributes:
      label: XinSpect 版本
      description: 主介面「關於」頁或標題列看到的版號。舊版問題請先升級到最新版再確認。
      placeholder: "3.27"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出問題的區域
      options:
        - 桌面主程式（GUI）
        - 終端機 xsc（CLI／REPL）
        - 強控台 Power Console
        - AI 診斷／遮蔽
        - 藍色中隊 BlueSquadron（守護進程／驅動）
        - 超頻橋接 XtuBridge
        - 安裝器／升級
        - 文件與宣稱不符
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: |
        從頭寫起，例如：以系統管理員啟動 3.27 → 點「深度規格」→ 選「處理器」→ 出現____，但預期是____。
        若與提權／ring0 相關，請寫明當時是以系統管理員啟動 3.27 還是一般權限。
      placeholder: |
        1. 以系統管理員啟動 3.27
        2. 進入「____」頁
        3. 點擊「____」
        4. 出現錯誤：____
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 預期行為與實際行為
      description: 兩者都寫。「應該顯示 X，實際顯示 Y」比「壞了」有用得多。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 證據（截圖／匯出報告／日誌）
      description: |
        匯出報告（主介面「匯出報告」）與 %LOCALAPPDATA%\XinSpect\ 下的日誌最有用。
        截圖請含完整視窗，不要只截一半。
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 機器環境
      description: Windows 版本、CPU／主機板、是否開 HVCI（記憶體完整性）、是否 testsigning、資安軟體。
      placeholder: "Windows 11 24H2 / i7-14700K / HVCI 開 / 無 testsigning / 無第三方防毒"
    validations:
      required: true
