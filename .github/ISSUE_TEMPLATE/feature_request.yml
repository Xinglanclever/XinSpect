name: 功能建議
description: 提出新能力、新頁面、新解碼器或既有流程的改進。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本專案對「新增」有一個固定門檻：**這個能力要能說出資料來源、量到什麼、以及讀不到時怎麼說**。
        只有「希望有一個總分」「希望自動幫我判斷好壞」這類需求會被拒絕，因為那會把判讀權從使用者手上拿走。
        若你手上有 U10 目錄的候選 ID（`U10-XX-####`），請一併填上。

  - type: textarea
    id: problem
    attributes:
      label: 你現在遇到的問題
      description: 描述情境，不要直接跳到解法。例如「換記憶體後不知道插對通道了沒」。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它做什麼
      description: 輸入是什麼、輸出長什麼樣、顯示在哪裡（頁面／CLI／報告）。
    validations:
      required: true

  - type: input
    id: u10
    attributes:
      label: U10 候選 ID（選填）
      description: 若對應 `docs/ULTIMATE-10000/` 的條目，請填 ID。
      placeholder: "U10-TS-0024"

  - type: dropdown
    id: area
    attributes:
      label: 主要落點
      options:
        - 新事實／檢測能力
        - 新解碼器（規格書解碼）
        - 新頁面或視覺化
        - CLI／自動化
        - 報告與匯出
        - 效能與資源使用
        - 文件與教學
        - 其他
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 資料從哪裡來
      description: 暫存器、WMI 類別、API、事件記錄、規格書章節。若還不知道，寫「未確認」也可以，但請不要編一個。
    validations:
      required: true

  - type: textarea
    id: unavailable
    attributes:
      label: 讀不到時應該怎麼顯示
      description: 本專案用六態區分 NotPresent／NotSupported／AccessDenied／ReadError 等；請說明這個能力最可能落在哪一種。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你試過的替代方案
      description: 其他工具、手動查法，或為什麼它們不夠好。

  - type: checkboxes
    id: confirm
    attributes:
      label: 送出前確認
      options:
        - label: 這個建議不會要求程式合成評分、排名或健康結論。
          required: true
        - label: 我理解功能建議不保證實作，會依來源可驗證性與維護成本排序。
          required: true
