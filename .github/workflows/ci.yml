name: CI

# 為什麼只跑守門測試、不跑全套：
# 全套 7,604 條裡有一部分會讀真機硬體（SMBIOS、SPD、NVMe…），在 GitHub 的 hosted runner
# 上可能因「不支援」或「值不一樣」而紅，讓 CI 變成雜訊。硬體全套由貢獻者在本機跑，
# PR 範本要求貼上實測數字；CI 只釘住「不依賴硬體」的那一層：能建置、版號與文件一致、
# 事實鍵目錄合法、U10 目錄結構正確、發版腳本沒被拆掉。
#
# 這一組是本機已驗證會綠的班底；要加測試請先確認它在乾淨 checkout 上不需要真機。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-guard:
    name: 建置與文件守門
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 安裝 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 還原
        run: dotnet restore Tests/XinSpect.Tests.csproj

      - name: 建置（含 Bridge 與解碼器）
        run: dotnet build Tests/XinSpect.Tests.csproj -c Release --no-restore

      - name: 文件與目錄守門
        # 這一組全部不依賴真機：版號六處、事實鍵目錄、U10 目錄結構、發版腳本、
        # README 的統計表與逐域展開（後兩者是第 278／279 輪補的——README 自己宣稱
        # 「可複算」，就必須有機器在算它）。
        run: dotnet test Tests/XinSpect.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~ChangelogTests|FullyQualifiedName~FactKeyCatalogTests|FullyQualifiedName~Ultimate10000CatalogTests|FullyQualifiedName~ReleasePipelineTests|FullyQualifiedName~ReleaseIntegrityTests|FullyQualifiedName~ReadmeStatsTests|FullyQualifiedName~ReadmeDomainTablesTests|FullyQualifiedName~ReadmeGeneratorTests|FullyQualifiedName~CommunityDocsTests|FullyQualifiedName~PciIdDatabaseTests" --logger "trx;LogFileName=guard.trx" --results-directory TestResults

      - name: 安裝 Python（產生器用）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 逐域展開產生器的自我檢查
        # 與 ReadmeGeneratorTests 重疊是刻意的：那條測試驗「工具對這棵樹說 OK」，
        # 這一步在 CI 上把同一件事再跑一次並留下輸出（PR 上直接看得到它比對了幾把鍵）。
        run: python Tools/gen-readme-domains.py --check

      - name: 百科／手冊 HTML 與來源 .md 的對帳
        # 這一對檔案沒有任何手寫內容：百科.html 來自 README.md、手冊.html 來自 手冊.md。
        # 改了 .md 沒重跑產生器，GitHub 上的說法與程式裡翻閱到的說法就會不同——
        # 這一步與 Tests/DocsHtmlTests 重疊也是刻意的（測試釘住內容，CI 留下比對輸出）。
        run: python Tools/gen-docs-html.py --check

      - name: 上傳測試結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-test-results
          path: TestResults/guard.trx
          if-no-files-found: warn
