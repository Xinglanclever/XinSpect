# XinSpect CI 守門
#
# 兩條線：
#   ① push／PR：守門子集（快、不依賴硬體）——類名全部由 Tests/CommunityDocsTests 釘住，
#      過濾字串打錯字會讓 CI 綠得很漂亮而一個測試都沒跑，那條守門就是防這個的。
#   ② 每週六：full-regression 全套回歸（全套 7,949 條）在 self-hosted runner
#      （xinpect-dev-machine，LocalSystem 服務）執行，前置僵屍進程健檢；
#      紅燈自動開 issue（permissions issues:write 已補）。
#
# 測試數是現在式數字，單一來源是 Tests/TestSuiteBaseline.cs 的 ProjectTests；
# 加測試就改那裡，本註解與 CONTRIBUTING／PR 範本同步跟隨。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 6"   # 每週六 02:00 UTC＝本機上午（full-regression）

permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: 守門子集（push／PR）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build tests
        run: dotnet build Tests\XinSpect.Tests.csproj -c Release -v minimal

      - name: Guard subset（不依賴硬體的守門五組＋誠實體系）
        run: >-
          dotnet test Tests\XinSpect.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~AiHardeningTests|FullyQualifiedName~ChangelogTests|FullyQualifiedName~ReadmeStatsTests|FullyQualifiedName~CommunityDocsTests|FullyQualifiedName~WarningBaselineTests|FullyQualifiedName~DeepBenchReviewFixTests|FullyQualifiedName~RuleEngineTests"

  full-regression:
    name: 全套回歸（每週六・self-hosted）
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, xinpect-dev-machine]
    steps:
      - uses: actions/checkout@v4

      - name: 前置健檢：僵屍進程清理
        run: |
          # 上一次量測/建置若留下卡死的子進程，先如實記錄再清理，避免環境性紅燈
          Get-Process | Where-Object { $_.ProcessName -match 'XinSpect|XinSpectConsole|BlueSquadronBridge|XtuBridge' } | ForEach-Object {
            Write-Host "殘留進程：$($_.ProcessName) PID=$($_.Id)"; Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build（含 Bridge 內嵌鏈）
        run: dotnet build XinSpect.csproj -c Release -v minimal

      - name: Full regression（全套 7,949 條）
        run: dotnet test Tests\XinSpect.Tests.csproj -c Release --no-build --nologo

      - name: 紅燈自動開 issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `full-regression 紅燈（${context.runId}）`,
              labels: ['ci-red'],
              body: `每週全套回歸失敗。Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n請先看失敗明細再動手，不要憑記憶改。`
            })
